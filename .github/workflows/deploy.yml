name: Deploy to GCP VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to GCP VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "agent.py,tools.py,simulator.py,prompts/,startup.sh,mcp/,topology/"
          target: /opt/network-mcp/

      - name: Restart MCP server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            sudo chown -R $USER:$USER /opt/network-mcp/
            sudo systemctl restart network-mcp
            sudo systemctl is-active network-mcp && echo "MCP server restarted OK" || echo "ERROR: MCP server failed"
